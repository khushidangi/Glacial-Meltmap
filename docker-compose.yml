version: '3.8'

services:
  # ====================================
  # Glacial MeltMap Application
  # ====================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: glacial-meltmap
    ports:
      - "5000:5000"
      - "3000:3000"
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=False
      - REACT_APP_API_URL=http://localhost:5000
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/glacial_meltmap
    volumes:
      - ./backend/data:/app/data
      - ./backend/models:/app/models
      - ./backend/output:/app/output
      - ./backend/logs:/app/logs
    depends_on:
      - db
    networks:
      - glacial-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ====================================
  # PostgreSQL Database
  # ====================================
  db:
    image: postgres:15-alpine
    container_name: glacial-meltmap-db
    environment:
      - POSTGRES_DB=glacial_meltmap
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --locale=en_US.UTF-8
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - glacial-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ====================================
  # Redis Cache (Optional)
  # ====================================
  cache:
    image: redis:7-alpine
    container_name: glacial-meltmap-cache
    ports:
      - "6379:6379"
    networks:
      - glacial-network
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass glacial_password
    volumes:
      - redis_data:/data

  # ====================================
  # Nginx Reverse Proxy (Optional)
  # ====================================
  nginx:
    image: nginx:alpine
    container_name: glacial-meltmap-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - glacial-network
    restart: unless-stopped

networks:
  glacial-network:
    driver: bridge

volumes:
  db_data:
    driver: local
  redis_data:
    driver: local
